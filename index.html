<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GymBoy</title>
  <meta name="description" content="Log your gym sessions: pick the day, add exercises, track weight and reps.">

  <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">

  <!-- Installable on the home screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GymBoy">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="view" aria-live="polite"></main>

  <!-- rest timer (shown after you tick a set) -->
  <div id="rest" class="rest" role="timer" hidden></div>

  <nav id="tabs" class="tabs" aria-label="Main" hidden></nav>

  <div id="overlay"></div>
  <div id="toasts" aria-live="polite"></div>

  <noscript><p style="padding:24px;font-family:sans-serif">GymBoy needs JavaScript to run.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/profile-utils.js"></script>
  <script src="js/howto-strength.js"></script>
  <script src="js/howto-move.js"></script>
  <script src="js/howto.js"></script>
  <script src="js/flow-data.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/sample-report.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/report-view.js"></script>
  <script src="js/screens-account.js"></script>
  <script src="js/screens-home.js"></script>
  <script src="js/screens-scan.js"></script>
  <script src="js/flows.js"></script>
  <script src="js/share.js"></script>
  <script src="js/pair.js"></script>
  <script src="js/screens-pair.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
